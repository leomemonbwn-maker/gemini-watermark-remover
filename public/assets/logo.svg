<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="GemClean AI 3D Logo">
  <defs>
    <!-- 3D Liquid Crystal Gradients -->
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>

    <linearGradient id="crystalFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70E1FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0072FF" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="shinePass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Drop Filter -->
    <filter id="glow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="liquidShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#00F2FE" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    @keyframes rotate3d {
      0% { transform: perspective(400px) rotateY(0deg) rotateX(0deg); }
      50% { transform: perspective(400px) rotateY(18deg) rotateX(-10deg); }
      100% { transform: perspective(400px) rotateY(0deg) rotateX(0deg); }
    }
    @keyframes pulseAura {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.12); opacity: 0.95; }
    }
    @keyframes sparkleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-3px) rotate(180deg); }
    }
    @keyframes shineSweep {
      0% { transform: translateX(-40px) translateY(-40px); }
      100% { transform: translateX(40px) translateY(40px); }
    }

    .logo-container {
      transform-origin: center;
      animation: rotate3d 6s ease-in-out infinite;
    }
    .aura-ring {
      transform-origin: center;
      animation: pulseAura 3.5s ease-in-out infinite;
    }
    .sparkle-core {
      transform-origin: center;
      animation: sparkleFloat 4s ease-in-out infinite;
    }
  </style>

  <!-- Outer Pulsing Liquid Energy Ring -->
  <circle class="aura-ring" cx="50" cy="50" r="42" stroke="url(#crystalGrad)" stroke-width="2.5" stroke-dasharray="8 4" fill="none" opacity="0.7" filter="url(#glow3d)" />

  <g class="logo-container" filter="url(#liquidShadow)">
    <!-- 3D Glass Crystal Shield Base -->
    <path d="M50 8 L82 26 V64 L50 92 L18 64 V26 Z" fill="url(#crystalGrad)" opacity="0.95" />

    <!-- 3D Facet Geometry -->
    <path d="M50 8 L82 26 L50 50 Z" fill="url(#crystalFacet)" opacity="0.85" />
    <path d="M18 26 L50 8 L50 50 Z" fill="#FFFFFF" opacity="0.3" />
    <path d="M18 26 L50 50 L18 64 Z" fill="url(#crystalFacet)" opacity="0.6" />
    <path d="M82 26 L82 64 L50 50 Z" fill="#0072FF" opacity="0.4" />
    <path d="M50 50 L82 64 L50 92 Z" fill="url(#crystalFacet)" opacity="0.9" />
    <path d="M50 50 L50 92 L18 64 Z" fill="#00C6FF" opacity="0.7" />

    <!-- Center 3D Gem Sparkle Star (✦) -->
    <g class="sparkle-core" filter="url(#glow3d)">
      <path d="M50 25 C50 38 38 50 25 50 C38 50 50 62 50 75 C50 62 62 50 75 50 C62 50 50 38 50 25 Z" fill="#FFFFFF" opacity="0.95" />
    </g>

    <!-- Specular Highlight Overlay -->
    <path d="M50 12 L78 28 L50 48 Z" fill="url(#shinePass)" />
  </g>
</svg>
