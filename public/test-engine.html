<!DOCTYPE html>
<html>
<head>
  <title>Watermark Engine Test</title>
  <style>
    body { background: #111; color: #fff; font-family: monospace; padding: 20px; }
    img { max-width: 400px; border: 2px solid #333; margin: 10px; }
    .result { display: flex; gap: 20px; flex-wrap: wrap; align-items: start; }
    pre { background: #222; padding: 15px; border-radius: 8px; overflow: auto; max-width: 800px; white-space: pre-wrap; }
    h2 { color: #06b6d4; }
  </style>
</head>
<body>
  <h1>🧪 Watermark Engine Test</h1>
  <div id="log"><pre>Loading...</pre></div>
  <div class="result">
    <div>
      <h2>Original (with watermark)</h2>
      <img id="before" src="/assets/before.png" />
    </div>
    <div>
      <h2>Cleaned (watermark removed)</h2>
      <img id="after" />
    </div>
  </div>

  <script type="module">
    // Import individual modules directly
    import { calculateAlphaMap } from '/src/engine/alphaMap.js';
    import { removeWatermark } from '/src/engine/blendModes.js';
    import { autoDetectWatermark, autoDetectWatermarks } from '/src/engine/detector.js';
    import { getWatermarkInfo } from '/src/engine/geometry.js';
    
    const logEl = document.querySelector('#log pre');
    function log(msg) {
      logEl.textContent += msg + '\n';
      console.log(msg);
    }

    async function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    async function test() {
      logEl.textContent = '';
      
      try {
        log('=== Watermark Engine Test ===');
        log('');
        
        // 1. Load assets
        log('1. Loading assets...');
        const [bg48, bg96] = await Promise.all([
          loadImage('/assets/bg_48.png'),
          loadImage('/assets/bg_96.png')
        ]);
        log('   bg48: ' + bg48.width + 'x' + bg48.height);
        log('   bg96: ' + bg96.width + 'x' + bg96.height);
        
        // 2. Load test image
        log('');
        log('2. Loading before.png...');
        const testImg = await loadImage('/assets/before.png');
        log('   Image: ' + testImg.width + 'x' + testImg.height);
        
        // Draw to canvas to get imageData
        const canvas = document.createElement('canvas');
        canvas.width = testImg.width;
        canvas.height = testImg.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(testImg, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        
        // 3. Geometry defaults
        log('');
        log('3. Geometry defaults:');
        const geo = getWatermarkInfo(testImg.width, testImg.height);
        log('   Size: ' + geo.size + ', X: ' + geo.x + ', Y: ' + geo.y + ', W: ' + geo.width + ', H: ' + geo.height);
        
        // 4. Auto-detect
        log('');
        log('4. Auto-detecting watermarks...');
        const t0 = performance.now();
        const detections = autoDetectWatermarks(imageData, bg96, bg48);
        const elapsed = (performance.now() - t0).toFixed(0);
        log('   Scan time: ' + elapsed + 'ms');
        log('   Detections found: ' + detections.length);
        
        detections.forEach((c, i) => {
          log('');
          log('   --- Detection #' + i + ' ---');
          log('   Size: ' + c.size + 'px');
          log('   Position: (' + c.x + ', ' + c.y + ')');
          log('   Corner: ' + c.corner);
          log('   Detected: ' + c.detected);
          log('   Score: ' + (c.score === Infinity ? 'Infinity' : (typeof c.score === 'number' ? c.score.toFixed(2) : c.score)));
        });
        
        // 5. Alpha map stats
        log('');
        log('5. Alpha Map Stats (for size=' + detections[0].size + '):');
        const aCanvas = document.createElement('canvas');
        aCanvas.width = detections[0].size;
        aCanvas.height = detections[0].size;
        const aCtx = aCanvas.getContext('2d');
        aCtx.imageSmoothingEnabled = true;
        aCtx.imageSmoothingQuality = 'high';
        aCtx.drawImage(detections[0].size <= 48 ? bg48 : bg96, 0, 0, detections[0].size, detections[0].size);
        const tmplData = aCtx.getImageData(0, 0, detections[0].size, detections[0].size);
        const alphaMap = calculateAlphaMap(tmplData);
        
        let minA = 1, maxA = 0, sumA = 0, nonZero = 0;
        for (let i = 0; i < alphaMap.length; i++) {
          if (alphaMap[i] > 0.001) {
            nonZero++;
            minA = Math.min(minA, alphaMap[i]);
            maxA = Math.max(maxA, alphaMap[i]);
          }
          sumA += alphaMap[i];
        }
        log('   Total pixels: ' + alphaMap.length);
        log('   Non-zero alpha pixels: ' + nonZero + ' (' + (nonZero/alphaMap.length*100).toFixed(1) + '%)');
        log('   Min alpha (non-zero): ' + minA.toFixed(4));
        log('   Max alpha: ' + maxA.toFixed(4));
        log('   Avg alpha: ' + (sumA / alphaMap.length).toFixed(4));
        
        // 6. Sample watermark region pixels BEFORE removal
        log('');
        log('6. Watermark region pixels BEFORE removal:');
        const det = detections[0];
        const cx = det.x + Math.floor(det.width/2);
        const cy = det.y + Math.floor(det.height/2);
        for (let dy = -2; dy <= 2; dy++) {
          let line = '   ';
          for (let dx = -2; dx <= 2; dx++) {
            const px = cx + dx * 8;
            const py = cy + dy * 8;
            const idx = (py * imageData.width + px) * 4;
            line += `(${imageData.data[idx]},${imageData.data[idx+1]},${imageData.data[idx+2]}) `;
          }
          log(line);
        }
        
        // 7. Apply removal
        log('');
        log('7. Applying watermark removal...');
        for (const config of detections) {
          const size = config.size;
          const c2 = document.createElement('canvas');
          c2.width = size; c2.height = size;
          const c2ctx = c2.getContext('2d');
          c2ctx.imageSmoothingEnabled = true;
          c2ctx.imageSmoothingQuality = 'high';
          c2ctx.drawImage(size <= 48 ? bg48 : bg96, 0, 0, size, size);
          const am = calculateAlphaMap(c2ctx.getImageData(0, 0, size, size));
          
          removeWatermark(imageData, am, config);
          log('   Removed at (' + config.x + ',' + config.y + ') size=' + size);
        }
        
        // 8. Sample pixels AFTER removal
        log('');
        log('8. Watermark region pixels AFTER removal:');
        for (let dy = -2; dy <= 2; dy++) {
          let line = '   ';
          for (let dx = -2; dx <= 2; dx++) {
            const px = cx + dx * 8;
            const py = cy + dy * 8;
            const idx = (py * imageData.width + px) * 4;
            line += `(${imageData.data[idx]},${imageData.data[idx+1]},${imageData.data[idx+2]}) `;
          }
          log(line);
        }
        
        // 9. Display result
        ctx.putImageData(imageData, 0, 0);
        canvas.toBlob(blob => {
          document.getElementById('after').src = URL.createObjectURL(blob);
          log('');
          log('9. ✅ Result displayed!');
        }, 'image/png');
        
      } catch(e) {
        log('');
        log('❌ ERROR: ' + e.message);
        log(e.stack);
      }
    }
    
    test();
  </script>
</body>
</html>
